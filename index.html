<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyLife">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MyLife 3.5.0</title>
<style>
  :root{
    --fs-base:18px; --fs-muted:16px; --fs-tiny:14px; --fs-control:18px;
    --fs-card-title:17px; --fs-card-value:20px; --fs-sheet-title:20px;
    --fs-question:24px; --fs-big:24px; --fs-nav:13px;
    /* ===== 3.1.1 — tema oscuro por defecto (negro verdoso, no negro puro) ===== */
    --bg:#090d0b; --bg-elevated:#101613; --card:#141b17; --card-strong:#19221d;
    --ink:#f2f6f3; --ink2:#9ba8a1; --ink3:#8d9a93;
    --line:#27332d; --line-soft:rgba(156,180,167,.16);
    --sage:#86b69d; --sage-d:#6fa58a; --green-bright:#8ed8ae;
    --gold:#d7b56d; --rose:#d98999; --clay:#d78772; --sky:#7fa9c7; --plum:#a88cc0;
    --sand:#2a2f28;
    --ok:#79c99d; --warn:#dfb65f; --bad:#d77979;
    --chip-bg:#1a231e; --chip-line:#29362f; --input-bg:#121a16;
    --r:20px; --sh:0 10px 30px rgba(0,0,0,.28);
  }
  [data-theme="light"]{
    --bg:#eef1f0; --bg-elevated:#ffffff; --card:#ffffff; --card-strong:#f7f5f0;
    --ink:#1c2523; --ink2:#525f5b; --ink3:#5c6864;
    --line:#e2e6e3; --line-soft:rgba(38,48,46,.10);
    --sage:#8fb6a4; --sage-d:#5d8f79; --green-bright:#5d8f79;
    --gold:#d8b46a; --rose:#d98a9c; --clay:#d9a08a; --sky:#a9c3d9; --plum:#b79ac4;
    --sand:#e9e2d5;
    --ok:#6fae8f; --warn:#d8b46a; --bad:#d98a8a;
    --chip-bg:#f1efe9; --chip-line:#e6e2da; --input-bg:#ffffff;
    --sh:0 2px 10px rgba(38,48,46,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:var(--fs-base); line-height:1.5; overscroll-behavior:none;}
  #root{max-width:520px;margin:0 auto;padding:12px 14px 96px;}
  h1,h2,h3{margin:0;font-weight:700}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:transform .18s ease}
  .card.tap:active{transform:scale(.985)}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .muted{color:var(--ink2);font-size:var(--fs-muted)}
  .tiny{color:var(--ink2);font-size:var(--fs-tiny);line-height:1.4;letter-spacing:.04em;text-transform:uppercase}
  .big{font-size:var(--fs-big);font-weight:700}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--chip-line);background:var(--chip-bg);color:var(--ink);border-radius:999px;
    padding:13px 17px;font-size:var(--fs-control);min-height:52px;cursor:pointer;transition:all .18s ease;font-family:inherit}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--sage-d);color:#06100b;border-color:var(--sage-d)}
  .chip.ghost{background:transparent;border:1px dashed #c9cfc9;color:var(--ink2)}
  .subst{display:flex;flex-direction:column;align-items:center;gap:2px;
    border:none;border-radius:16px;padding:10px 6px;min-width:60px;flex:1;
    cursor:pointer;transition:transform .18s ease;font-family:inherit}
  .subst:active{transform:scale(.93)}
  .subst .n{font-size:23px;font-weight:800}
  .subst .em{font-size:24px}
  .subst .last{font-size:13px;color:var(--ink2)}
  .btnbig{flex:1;border:none;border-radius:18px;padding:16px 8px;font-size:18px;min-height:60px;font-weight:700;
    color:#fff;cursor:pointer;box-shadow:var(--sh);font-family:inherit;transition:transform .18s ease}
  .btnbig:active{transform:scale(.97)}
  .btn{border:none;border-radius:14px;padding:13px 18px;font-weight:600;font-size:var(--fs-control);min-height:44px;
    cursor:pointer;background:var(--sage-d);color:#fff;font-family:inherit}
  .btn.sec{background:#eceae4;color:var(--ink)}
  .btn.danger{background:var(--bad);color:#fff}
  .btn:active{transform:scale(.97)}
  .sheet{position:fixed;inset:0;background:rgba(38,48,46,.35);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease}
  .sheet .body{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:16px 16px 32px;animation:up .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .x{border:none;background:#e5e3dc;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
  .progress{height:4px;background:#e5e3dc;border-radius:99px;margin:6px 0 14px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--sage-d);border-radius:99px;transition:width .2s ease}
  .qtitle{font-size:var(--fs-question);line-height:1.3;font-weight:700;margin:6px 0 14px}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
    z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:fade .2s ease;max-width:88%;text-align:center}
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-top:1px solid #e3e1da;display:flex;justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
  .nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;
    font-size:var(--fs-nav);color:var(--ink2);cursor:pointer;font-family:inherit;padding:4px 12px;min-height:44px}
  .nav button.on{color:var(--sage-d);font-weight:700}
  .nav .ico{font-size:24px}
  .bar{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0 4px}
  .bar .b{flex:1;background:var(--sage);border-radius:6px 6px 2px 2px;min-height:2px;cursor:pointer;transition:opacity .18s}
  .bar .b.sel{background:var(--sage-d)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0eee8;font-size:17px}
  .kv:last-child{border-bottom:none}
  .conf{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
  textarea.io{width:100%;min-height:150px;border-radius:14px;border:1px solid #ddd;
    padding:12px;font-size:16px;font-family:ui-monospace,monospace;background:var(--input-bg);color:var(--ink)}
  .evline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0eee8;font-size:16px}
  .del{margin-left:auto;border:none;background:#f6e8e8;color:#b05a5a;border-radius:12px;padding:10px 14px;font-size:14px;min-height:44px;cursor:pointer}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 2px 14px}
  .sleepbtn{border:none;border-radius:14px;min-width:44px;min-height:44px;padding:9px 12px;font-size:20px;cursor:pointer;
    background:var(--card);box-shadow:var(--sh)}
  .coachdot{width:8px;height:8px;border-radius:99px;background:var(--sage-d);flex-shrink:0;margin-top:7px}

  /* RC3.1: pantalla completa para procesos profundos */
  .sheet.fullscreen{align-items:stretch;background:var(--bg);backdrop-filter:none}
  .sheet.fullscreen .body{width:100%;max-width:520px;margin:0 auto;height:100dvh;max-height:none;
    border-radius:0;padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:fade .18s ease}
  .sheethead{position:sticky;top:0;background:var(--bg);z-index:5;
    padding:calc(12px + env(safe-area-inset-top)) 0 10px;margin:0 0 6px}
  .sheet:not(.fullscreen) .sheethead{padding-top:4px;position:static}
  .sheethead h3{font-size:var(--fs-sheet-title);flex:1;text-align:center;margin:0 8px}
  .headspace{width:44px;height:44px;flex-shrink:0}
  .chip.on::before{content:"✓ "}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }

/* ===== RC3.2 · Estética final (Addendum VIII) ===== */
:root{
  --sem-presencia:#7fa88f; --sem-coach:#8b93c7; --sem-director:#5b7391;
  --sem-cientifico:#4e8f8a; --sem-oro:#c9a86a; --sem-cuerpo:#d98873;
  --sem-sueno:#5b6b8c; --sem-activacion:#d9a441; --sem-sos:#c77e63;
}
/* jerarquía de cards */
.card-primary{border-radius:24px;padding:18px;box-shadow:0 8px 26px rgba(38,48,46,.08);
  background:var(--card);margin-bottom:14px}
.card-secondary{border-radius:20px;padding:15px;box-shadow:0 3px 12px rgba(38,48,46,.06);
  background:var(--card);margin-bottom:12px}
.card-inline{border-radius:16px;padding:12px 14px;box-shadow:none;
  border:1px solid rgba(38,48,46,.06);background:var(--card);margin-bottom:10px}
/* acento semántico por borde/halo, jamás fondo completo */
.acc-coach{border-left:4px solid var(--sem-coach)}
.acc-director{border-left:4px solid var(--sem-director)}
.acc-cientifico{border-left:4px solid var(--sem-cientifico)}
.acc-oro{border-left:4px solid var(--sem-oro)}
.acc-cuerpo{border-left:4px solid var(--sem-cuerpo)}
.acc-presencia{border-left:4px solid var(--sem-presencia)}
/* bloque epistémico Hecho/Inferencia */
.epis{margin:8px 0;padding:8px 12px;border-radius:14px;background:#f6f4ee;
  border:1px solid rgba(38,48,46,.05)}
.epis .lvl{display:inline-block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink2);font-weight:700;margin-bottom:2px}
.epis p{margin:2px 0 0}
/* microanimaciones 180-240ms, solo donde importa */
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}
.toast{animation:pop .2s ease}
.bar .b{transition:height .22s ease}
@keyframes lawconfetti{0%{transform:translateY(-8px) rotate(0);opacity:1}
  100%{transform:translateY(48px) rotate(240deg);opacity:0}}
.confetti{position:fixed;top:12%;left:0;right:0;pointer-events:none;z-index:99;text-align:center}
.confetti span{display:inline-block;margin:0 6px;font-size:22px;animation:lawconfetti .9s ease forwards}

  /* RC4.4 §6 — selector grande para Lugar y Ejercicio */
  .selector-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .selector-option{min-height:58px;font-size:18px;line-height:1.25;padding:13px 12px;
    border:1px solid var(--chip-line);border-radius:14px;background:var(--chip-bg);color:var(--ink);display:flex;align-items:center;gap:10px;
    cursor:pointer;font-family:inherit;text-align:left}
  .selector-option .emoji{font-size:25px}
  .selector-option.on{background:var(--sage-d);color:#06100b}
  @media (max-width:350px){ .selector-grid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

  /* 🌊 RC4.4 §16 — ola de craving */
  .wave{position:absolute;left:-50%;top:12px;width:200%;height:120px;
    background:radial-gradient(80px 34px at 50% 0, #9db9c6 88%, transparent 90%);
    background-size:160px 60px;background-repeat:repeat-x;opacity:.75;
    animation:waveMove 6s linear infinite}
  .flatwave{animation:waveMove 12s linear infinite, waveFlat 2s ease forwards}
  @keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(160px)}}
  @keyframes waveFlat{to{top:34px;opacity:.45}}

  /* ===== MyLife 3.0 — rueda radial ===== */
  .wheelwrap{position:relative;width:100%;max-width:380px;aspect-ratio:1;margin:6px auto 10px}
  .wheellines{position:absolute;inset:0;width:100%;height:100%}
  .wheelcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:38%;aspect-ratio:1;border-radius:50%;cursor:pointer;font-family:inherit;color:var(--ink);
    background:radial-gradient(circle at 35% 28%, #1e2a24, #101613 65%);
    border:1px solid #33463c;
    box-shadow:0 10px 32px rgba(0,0,0,.42), inset 0 0 0 2px rgba(134,182,157,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;z-index:2}
  .wheelsat{position:absolute;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;
    border-radius:50%;border:none;cursor:pointer;font-family:inherit;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    box-shadow:0 4px 14px rgba(60,70,60,.12);padding:4px}
  .satemoji{font-size:24px;line-height:1.1}
  .satlabel{font-weight:800;font-size:14px;line-height:1.15}
  .satsub{font-size:11px;color:#5f6660;line-height:1.12;text-align:center;max-width:94%}
  .satplus{font-size:14px;color:var(--ink2);border:1.5px solid #b9beb4;border-radius:50%;
    width:16px;height:16px;line-height:13px;margin-top:2px}
  .pulsing{animation:satpulse 1.6s ease-in-out infinite}
  @keyframes satpulse{0%,100%{box-shadow:0 4px 14px rgba(60,70,60,.12)}50%{box-shadow:0 4px 22px rgba(125,155,118,.55)}}
  .rachapill{background:var(--card);color:var(--ink);border-radius:14px;padding:6px 12px;text-align:center;
    font-weight:800;font-size:17px;box-shadow:0 2px 8px rgba(60,70,60,.08)}
  .tag{border-radius:10px;padding:3px 8px;font-size:12px;font-weight:700}
  /* nav 3.0 con botón central elevado */
  .nav .navplus{position:relative;top:-16px}
  .nav .navplus .plusdot{width:52px;height:52px;border-radius:50%;background:var(--sage-d);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto;
    box-shadow:0 6px 16px rgba(92,122,85,.4)}

  /* RC2 §25 — encabezado sin salto de línea */
  .greeting{display:flex;align-items:center;flex-wrap:nowrap;min-width:0;flex:1}
  .greeting-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* conectores con más presencia */
  

  /* 3.1 — cubierta de privacidad al salir de la app */
  .privacycover{position:fixed;inset:0;background:var(--bg);z-index:9999;
    display:flex;align-items:center;justify-content:center}
  .pcbrand{font-size:26px;font-weight:800;color:var(--ink2);letter-spacing:.04em}

  /* ===== 3.1.1 — tema oscuro aplicado a toda la superficie ===== */
  [data-theme="light"] .wheelcenter{
    background:radial-gradient(circle at 35% 28%, #ffffff, #f2f2ee 70%);
    color:var(--ink); border:1px solid #e3e6e0;
    box-shadow:0 6px 22px rgba(60,70,60,.14), inset 0 0 0 2px rgba(93,143,121,.12);}
  .wheelsat{background:var(--card);color:var(--ink);
    border:1px solid var(--satcolor,#2a3630);
    box-shadow:0 8px 22px rgba(0,0,0,.28), 0 0 18px var(--satglow,transparent)}
  [data-theme="light"] .wheelsat{box-shadow:0 4px 14px rgba(60,70,60,.12)}
  .satsub{color:var(--ink2)}
  .wheellines line{stroke:rgba(134,182,157,.32);stroke-width:2;stroke-dasharray:3 7}
  .wheellines line.hot{stroke:var(--clay);stroke-dasharray:none;opacity:.9}
  [data-theme="light"] .wheellines line{stroke:rgba(93,143,121,.35)}
  .sheet{background:rgba(0,0,0,.62);z-index:200}
  .sheet .body{background:var(--bg-elevated);color:var(--ink)}
  .sheethead{border-bottom:1px solid var(--line)}
  .sheet .x{background:transparent;color:var(--ink2);border:none}
  .nav{background:rgba(9,13,11,.94);border-top:1px solid var(--line);
    backdrop-filter:saturate(140%) blur(8px)}
  [data-theme="light"] .nav{background:rgba(255,255,255,.94)}
  .nav button{color:var(--ink2)}
  .nav button.on{color:var(--green-bright)}
  .toast{background:#edf5f0;color:#111713}
  .btn{background:var(--sage-d);color:#06100b}
  .btn.sec{background:var(--chip-bg);color:var(--ink);border:1px solid var(--chip-line)}
  input,textarea,select{background:var(--input-bg);color:var(--ink);
    border:1px solid var(--chip-line);border-radius:12px}
  input::placeholder,textarea::placeholder{color:var(--ink3)}
  .kv{border-bottom:1px solid var(--line-soft)}
  .privacycover{background:var(--bg)}
  .pcbrand{color:var(--ink2)}
  /* barra de contexto */
  .ctxbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:10px 12px;margin-bottom:12px}
  .ctxitem{font-size:15px;color:var(--ink2);background:transparent;border:none;
    font-family:inherit;cursor:pointer;padding:4px 2px}
  .ctxitem b{color:var(--ink);font-weight:700}
  .ctxplus{margin-left:auto;border:1px solid var(--chip-line);background:var(--chip-bg);
    color:var(--ink);border-radius:999px;min-height:38px;padding:6px 14px;font-size:15px;
    font-family:inherit;cursor:pointer}
  /* pulso compacto */
  .pulseline{display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;
    cursor:pointer;font-size:16px;color:var(--ink)}
  /* cápsula global de episodio */
  .capsule{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;
    width:min(500px,94vw);pointer-events:auto;background:var(--card-strong);border:1px solid var(--line);
    border-radius:18px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .capsule .caprow{display:flex;align-items:center;gap:10px}
  .capsule .captitle{font-weight:800;font-size:16px;flex:1;text-align:left;
    background:none;border:none;color:var(--ink);font-family:inherit;cursor:pointer}
  .capsule .capacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .capsule .capbtn{flex:1;min-width:88px;min-height:44px;border-radius:12px;
    border:1px solid var(--chip-line);background:var(--chip-bg);color:var(--ink);
    font-size:15px;font-family:inherit;cursor:pointer}
  .capsule .capmin{background:none;border:none;color:var(--ink2);font-size:20px;cursor:pointer}
  .capsule.min .capacts{display:none}
  /* botón flotante fuera de Home */
  .fab{position:fixed;right:16px;bottom:84px;z-index:45;width:56px;height:56px;border-radius:50%;
    background:var(--sage-d);color:#06100b;border:none;font-size:28px;cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.42)}
  /* resumen de una línea */
  .summaryline{text-align:center;color:var(--ink2);font-size:15px;margin:2px 0 12px}
  .trajline{display:flex;align-items:center;gap:8px;background:transparent;border:none;
    color:var(--ink2);font-size:15px;font-family:inherit;cursor:pointer;padding:6px 2px;width:100%}

  /* el FAB nunca queda debajo de la cápsula */
  body:has(.capsule) .fab{bottom:auto;top:calc(100vh - 240px)}

  /* ===== 3.1.2 — tintes semánticos legibles en ambos temas =====
     Un elemento con --tint conserva su color de categoría, pero como
     tinte sobre la superficie del tema: el texto NUNCA queda invisible. */
  [style*="--tint"]{
    background: var(--card);
    background: color-mix(in srgb, var(--tint, transparent) 14%, var(--card));
    color: var(--ink);
    border: 1px solid transparent;
    border-color: color-mix(in srgb, var(--tint, transparent) 30%, var(--line));
  }
  [data-theme="light"] [style*="--tint"]{
    background: var(--tint, var(--card));
    color: var(--ink);
    border-color: color-mix(in srgb, var(--tint, transparent) 70%, var(--line));
  }
  /* Los hijos heredan el color legible del contenedor tintado */
  [style*="--tint"] .muted, [style*="--tint"] .tiny{ color: var(--ink2) }
  /* Botones con color de marca: texto siempre oscuro sobre color claro */
  .btn, .btnbig{ color:#06100b }
  .btn.sec{ color:var(--ink) }
  .btn.danger, .btn[style*="--bad"], .chip.danger{ color:#180a0a }
  .sleepbtn{ background:var(--card); color:var(--ink); border:1px solid var(--line) }
  [data-theme="light"] .sleepbtn{ background:#fff; color:var(--ink) }
  /* Texto terciario con contraste suficiente sobre negro verdoso */
  :root{ --ink3:#8d9a93 }
  .capsule .capbtn.primary{ background:var(--sage-d); color:#06100b }

  /* 3.1.2 — el centro y los acentos deben ser legibles también en claro */
  [data-theme="light"] .wheelcenter span[style*="color"]{ filter:brightness(.62) saturate(1.25) }
  [data-theme="light"] .tiny{ color:var(--ink2) }

  .centerbig{ color:var(--ringcolor,var(--ink)) }
  [data-theme="light"] .centerbig{ color:color-mix(in srgb, var(--ringcolor,#000) 62%, #14201b) }

  /* 3.1.2 — acentos verdes legibles en modo claro (pestaña activa, cifras) */
  [data-theme="light"]{ --sage-d:#3f7a60; --ok:#2f7a58; --green-bright:#2f7a58 }
  [data-theme="light"] .nav button.on{ color:#2f6b52 }
  .nav button.on{ font-weight:700 }

  /* 3.1.2 — chip seleccionado: texto claro sobre verde profundo en modo claro */
  [data-theme="light"] .chip.on,
  [data-theme="light"] .selector-option.on,
  [data-theme="light"] .btn{ color:#ffffff }
  [data-theme="light"] .btn.sec{ color:var(--ink) }

  /* botón destructivo: rojo profundo con texto blanco en ambos temas */
  .btn.danger{ background:#a33f3f; color:#ffffff }
  [data-theme="light"] .btn.danger{ background:#9c3535; color:#ffffff }

  /* ===== 3.2 — película del día ===== */
  .filmwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 14px 10px;margin-bottom:12px;cursor:pointer;position:relative}
  .filmwrap.empty{padding:18px 14px;cursor:default}
  .filmline{position:relative;height:46px;border-bottom:1px solid var(--line-soft)}
  .filmdot{position:absolute;bottom:0;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:2px}
  .filmstem{width:2px;height:10px;border-radius:1px;opacity:.85}
  .filmcluster{position:absolute;top:2px;bottom:0;border-radius:10px;border:1px solid}
  .filmaxis{position:relative;height:16px;margin-top:4px}
  .filmaxis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink2)}
  .filmrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;
    color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer}
  .filmtime{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px;min-width:44px;text-align:left}
  /* ===== 3.2 — reloj vivo ===== */
  .liveclock{width:100%;background:var(--card);border:1px solid var(--line);
    border-color:color-mix(in srgb, var(--tint,transparent) 32%, var(--line));
    border-radius:18px;padding:14px;margin-bottom:12px;text-align:center;
    color:var(--ink);font-family:inherit;cursor:pointer}
  .clockbig{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:.02em;line-height:1.1;color:var(--ink)}

  /* 3.2 — el reloj usa el tinte sólo en el borde, nunca de fondo del texto */
  .liveclock{ background:var(--card) }
  [data-theme="light"] .liveclock{ background:#fff }
  .liveclock .muted{ color:var(--ink2) }

  /* ===== 3.2.2 §27 — residuos del tema claro dentro del oscuro ===== */
  .epis, .epis *{ background:var(--card-strong) !important; color:var(--ink); border-color:var(--line) }
  [data-theme="light"] .epis, [data-theme="light"] .epis *{ background:#f7f5ef !important; color:var(--ink) }
  textarea, textarea.io{ background:var(--input-bg) !important; color:var(--ink) !important;
    border:1px solid var(--chip-line) }
  .del{ background:color-mix(in srgb, var(--bad) 16%, var(--card)); color:var(--bad);
    border:1px solid color-mix(in srgb, var(--bad) 30%, var(--line)) }
  .progress, .track{ background:var(--line) }
  .last, .ago{ color:var(--ink2) }

/* ===== 3.3.0 · HOY: contadores de un toque ===== */

.wakemoods{margin-top:16px;text-align:left}
.moodrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.moodrow.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.moodbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:6px 2px;
  background:var(--chip-bg);color:var(--ink);border:1px solid var(--chip-line);border-radius:14px;
  font-size:13px;font-weight:600;cursor:pointer}
.moodbtn > span{font-size:22px;line-height:1.1}
.moodbtn.on{border-color:var(--green-bright);box-shadow:inset 0 0 0 1px var(--green-bright)}
.moodbtn:active{transform:scale(.97)}
.whyabout{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.whytext{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--chip-line);
  background:var(--input-bg);color:var(--ink);min-height:48px;box-sizing:border-box}
.guiderow{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:12px}
.tline{position:relative;height:34px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--chip-line);overflow:hidden}
.tline i{position:absolute;top:5px;bottom:5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--sage)}
.tline i.close{background:var(--gold)}
.tlineaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:3px}

/* ===== 3.5.0 · Dos apps en una, scroll libre, HOY con más espacio ===== */
/* claro = blanco y gris (Osk registra de día) */
[data-theme="light"]{ --bg:#f2f3f5; --bg-elevated:#ffffff; --card:#ffffff; --card-strong:#f8f9fa;
  --line:#e3e5e8; --chip-bg:#f1f2f4; --chip-line:#e0e3e7; --input-bg:#ffffff;
  --sh:0 2px 12px rgba(30,36,44,.06) }
/* el piso: el contenido nunca queda debajo de la barra (incluye la rayita del iPhone) */
#root{padding-top:max(10px, env(safe-area-inset-top));
  padding-bottom:calc(132px + env(safe-area-inset-bottom))}
html,body{overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch}
.toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.nav{z-index:60}
/* selector de modo */
.modebar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;
  margin:0 -14px 12px;padding:8px 14px;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px)}
.modeseg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;
  background:var(--chip-bg);border:1px solid var(--chip-line)}
.modeseg button{min-height:40px;border:none;border-radius:999px;background:transparent;color:var(--ink2);
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.modeseg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mode-personal .modeseg button.on{background:var(--sage-d);color:#06100b}
[data-theme="light"] .mode-personal .modeseg button.on{color:#ffffff}
.modetheme{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--chip-line);
  background:var(--chip-bg);font-size:19px;cursor:pointer;touch-action:manipulation}
/* pie de página por modo */
.mode-personal .nav button.on .ico{background:color-mix(in srgb, var(--plum) 26%, transparent)}
/* HOY con aire */
.hoy{gap:14px}
.hoycard{padding:16px;border-radius:22px}
.hoytotal{font-size:72px}
.hoybtn{min-height:84px;padding:12px 14px;border-radius:20px}
.hoybtn.big{min-height:104px}
.hoybtn .hoyemoji{font-size:32px}
.hoybtn.big .hoyemoji{font-size:36px}
.hoybtn .hoycount{font-size:34px}
.hoybtn.big .hoycount{font-size:40px}
.hoybtn .hoylabel{font-size:18px}
.hoyclockbig{font-size:44px}
.hoysec{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:6px 2px -4px}
.hoycard .hoysec{margin:0 0 10px}
.hoyplaces{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hoyplace{flex-direction:column;gap:4px;min-height:78px;padding:10px 6px;border-radius:18px;font-size:15px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.hoyplaceemoji{font-size:28px;line-height:1}
.hoyplacename{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoyplace.on{background:color-mix(in srgb, var(--green-bright) 14%, var(--card))}
.hoycomp{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;line-height:1.3}
.hoycomp.c-cumple{color:var(--ok)} .hoycomp.c-no_cumple{color:var(--warn)}
[data-theme="light"] .hoycomp.c-no_cumple{color:#8a5a00}
.hoymoodrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hoymood .moodbtn{min-height:76px}
.moodemoji{font-size:28px}
.hoyex{display:flex;flex-direction:column;gap:10px}
.hoyexlist{display:flex;flex-direction:column}
.hoyexrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.hoyexemoji{font-size:24px}
.hoyextxt{flex:1;min-width:0;font-size:16px;color:var(--ink)}
.hoyexdel{width:44px;height:44px;border-radius:12px;border:1px solid var(--chip-line);background:var(--chip-bg);
  font-size:18px;cursor:pointer}
.hoyextotal{padding-top:8px;font-size:15px;color:var(--ink2)} .hoyextotal b{color:var(--ink)}
.hoyexadd{min-height:56px;border-radius:16px;border:1.5px dashed var(--sage-d);background:transparent;
  color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.exwhen{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.exwhen .chip{min-height:44px}
/* plan: fases tocables, cumplimiento y tramos */
.planphases .planphase{cursor:pointer;background:transparent;font-family:inherit;min-height:44px}
.planphase.view{box-shadow:0 0 0 2px var(--ink2)}
.planphase.done{color:var(--ink)}
.plancomp{border-left:5px solid var(--sky)}
.plancomp.c-cumple{border-left-color:var(--ok)} .plancomp.c-no_cumple{border-left-color:var(--warn)}
.plancompbig{font-size:22px;font-weight:800;color:var(--ink);margin:4px 0}
.plantramos{display:flex;flex-direction:column;gap:8px}
.plantramo{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;
  border:1px solid var(--chip-line);background:var(--chip-bg);color:var(--ink);font-size:15px}
.plantramo.on{border-color:var(--sage-d);box-shadow:inset 0 0 0 1px var(--sage-d)}
@media (max-width:350px){ .hoytotal{font-size:56px} .hoybtn.big .hoycount{font-size:30px} .hoyplace{font-size:13px} }
.hoyplace .hoyplaceemoji{font-size:28px;line-height:1}
.hoymood .moodbtn .moodemoji{font-size:30px;line-height:1}
.hoymood .moodbtn{font-size:16px}
/* botones grandes: número arriba, nombre completo abajo (nunca "Ci…") */
.hoybtn.big{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;row-gap:2px;align-items:center}
.hoybtn.big .hoyemoji{grid-column:1;grid-row:1}
.hoybtn.big .hoycount{grid-column:2;grid-row:1;justify-self:end}
.hoybtn.big .hoylabel{grid-column:1 / span 2;grid-row:2;padding:0}
.hoybtn.big .hoyplus{grid-column:1 / span 2;grid-row:3}
.hoymood .moodbtn > span:last-child{font-size:15px;font-weight:600}
.modetheme,.hoyexdel{color:var(--ink)}
.planphases .planphase.on{background:var(--sage-d);color:#06100b;border-color:var(--sage-d)}
[data-theme="light"] .planphases .planphase.on{color:#ffffff}
.hoyplace.on{background:#1d2a23}
[data-theme="light"] .hoyplace.on{background:#e6f1eb}

</style>

<div id="root"></div>
<script>window.__MYLIFE_MOUNTED__=false;
window.MyLifeEmergency={
  readRaw(){ try{ return localStorage.getItem("mylife_v1")||""; }catch(e){ return ""; } },
  copyRaw(){ const raw=this.readRaw();
    return navigator.clipboard.writeText(raw); },
  downloadRaw(){ const raw=this.readRaw();
    const blob=new Blob([raw],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="mylife-emergency-"+Date.now()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url); }
};
(function(){
  function panel(msg){
    if(document.getElementById("mylife-boot-error"))return;
    document.body.innerHTML='<main style="padding:24px;font-family:-apple-system,sans-serif">'
      +'<h1 style="font-size:20px">Error de inicio de MyLife</h1>'
      +'<p style="color:var(--ink2,#8d9a93)">v3.5.0 · schema 3</p>'
      +'<pre id="mylife-boot-error" style="white-space:pre-wrap;background:#f5f2ec;padding:12px;border-radius:12px;font-size:13px"></pre>'
      +'<button id="g-copy" style="padding:12px 16px;border:none;border-radius:12px;background:#5d8f79;color:#fff;font-size:16px;margin:4px">Copiar diagnóstico</button>'
      +'<button id="g-data" style="padding:12px 16px;border:none;border-radius:12px;background:#d8b46a;color:#fff;font-size:16px;margin:4px">🛟 Copiar datos</button>'
      +'<button id="g-dl" style="padding:12px 16px;border:none;border-radius:12px;background:#a9c3d9;color:#26302e;font-size:16px;margin:4px">Descargar datos</button></main>';
    document.getElementById("mylife-boot-error").textContent=msg;
    document.getElementById("g-copy").onclick=function(){
      var t="MyLife v3.5.0\n"+msg;
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);}
    };
    document.getElementById("g-data").onclick=function(){window.MyLifeEmergency.copyRaw();};
    document.getElementById("g-dl").onclick=function(){window.MyLifeEmergency.downloadRaw();};
  }
  window.addEventListener("error",function(ev){
    if(window.__MYLIFE_MOUNTED__)return;
    panel(String((ev.error&&ev.error.stack)||ev.message||ev));
  });
  setTimeout(function(){
    var r=document.getElementById("root");
    if(!window.__MYLIFE_MOUNTED__&&(!r||r.childElementCount===0)){
      panel("La aplicacion no arranco en 4 segundos y no reporto ningun error. Revisa la consola.");
    }
  },4000);
})();</script>
